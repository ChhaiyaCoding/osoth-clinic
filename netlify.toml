[build]
  command = "npm run build"
  publish = "dist"

# No SPA redirect rule is needed: the app uses hash routing, so every URL the
# browser requests is "/" and the server never sees the route.

[[headers]]
  for = "/sw.js"
  [headers.values]
    # The service worker must never be served stale, or installs get stuck on an
    # old build. The assets it precaches are content-hashed and cached forever.
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
