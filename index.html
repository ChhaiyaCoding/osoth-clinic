<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The light canvas colour; the script below swaps it for dark. -->
    <meta name="theme-color" content="#f4f6f9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ប្រព័ន្ធគ្រប់គ្រងឱសថ</title>
    <script>
      // Runs before the stylesheet paints, so a dark-mode user never sees a
      // white flash. lib/theme.ts takes over once the app boots.
      (function () {
        try {
          var mode = localStorage.getItem('clinic.theme') || 'system'
          var dark =
            mode === 'dark' ||
            (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#101725' : '#f4f6f9')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
